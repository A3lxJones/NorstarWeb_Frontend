name: E2E Tests

on:
    push:
        branches: [main, develop]
    pull_request:
        branches: [main, develop]
        types: [opened, synchronize, reopened]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
    group: e2e-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    playwright:
        name: Playwright E2E
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "18"
                  cache: "npm"

            - name: Install dependencies
              run: npm ci

            - name: Install Playwright browsers
              run: npx playwright install --with-deps chromium

            - name: Run Playwright tests
              run: npm run test:e2e
              env:
                  CI: "true"
                  NODE_ENV: test
                  # A non-secret value is fine here — this server never runs in
                  # production mode during tests, so no real secrets are exposed.
                  SESSION_SECRET: ${{ secrets.TEST_SESSION_SECRET || 'norstar-ci-e2e-secret' }}

            - name: Upload Playwright report
              if: ${{ !cancelled() }}
              uses: actions/upload-artifact@v4
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 14
